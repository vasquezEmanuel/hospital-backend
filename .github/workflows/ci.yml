# CI: se ejecuta en cada Pull Request y en cada push a main.
# Revisa estilo, pruebas, que schema.sql y las migraciones coincidan, y vulnerabilidades en dependencias.
# (El paso de migrar la base de datos y desplegar se agrega más adelante, cuando exista Supabase/Render.)
name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Pruebas (aplican alembic upgrade head sobre una BD vacía)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hospital_test
        run: |
          createdb hospital_test
          pytest --cov=app --cov-fail-under=80
      - name: schema.sql debe equivaler a las migraciones
        run: |
          createdb drift_a && createdb drift_b
          psql -v ON_ERROR_STOP=1 -q -d drift_a -f schema.sql
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/drift_b alembic upgrade head
          python scripts/check_schema_drift.py \
            postgresql://postgres:postgres@localhost:5432/drift_a \
            postgresql://postgres:postgres@localhost:5432/drift_b
      - name: Dependencias con vulnerabilidades conocidas
        run: pip-audit -r requirements.txt